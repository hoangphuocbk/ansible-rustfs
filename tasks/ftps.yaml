---
# FTP / FTPS gateway preparation.
#
# FTP and FTPS are separate listeners. Plain FTP needs no certificate material;
# FTPS needs rustfs_cert.pem and rustfs_key.pem in RUSTFS_FTPS_CERTS_DIR.

- name: ftps | prepare certificate material
  become: true
  when: rustfs_ftps_enable | bool
  block:
    - name: ftps | require a certificate directory
      ansible.builtin.assert:
        that:
          - rustfs_ftps_certs_dir | length > 0
        fail_msg: >-
          rustfs_ftps_enable is true but rustfs_ftps_certs_dir is empty. Set it
          to a directory containing rustfs_cert.pem and rustfs_key.pem.

    - name: ftps | validate self-signed certificate settings
      ansible.builtin.assert:
        that:
          - rustfs_ftps_self_signed_common_name | length > 0
          - (rustfs_ftps_self_signed_key_size | int) >= 2048
          - (rustfs_ftps_self_signed_days | int) >= 1
          - (rustfs_ftps_self_signed_renew_days | int) >= 0
          - (rustfs_ftps_self_signed_renew_days | int) < (rustfs_ftps_self_signed_days | int)
        fail_msg: >-
          Self-signed FTPS certificates require a non-empty common name, an RSA
          key of at least 2048 bits, a positive validity period and a renewal
          window shorter than that period.
      when: rustfs_ftps_self_signed | bool

    - name: ftps | create certificate directory
      ansible.builtin.file:
        path: "{{ rustfs_ftps_certs_dir }}"
        state: directory
        owner: "{{ rustfs_user }}"
        group: "{{ rustfs_group }}"
        mode: "0700"

    - name: ftps | build self-signed SAN names
      ansible.builtin.set_fact:
        _rustfs_ftps_san_dns: >-
          {{ ([rustfs_ftps_self_signed_common_name, inventory_hostname,
               ansible_hostname | default(''), ansible_fqdn | default(''), 'localhost']
              + rustfs_ftps_self_signed_dns_sans)
             | reject('equalto', '') | unique | list }}
        _rustfs_ftps_san_ip: >-
          {{ ([(ansible_default_ipv4 | default({})).get('address', ''), '127.0.0.1']
              + rustfs_ftps_self_signed_ip_sans)
             | reject('equalto', '') | unique | list }}
      when: rustfs_ftps_self_signed | bool

    - name: ftps | build self-signed subjectAltName
      ansible.builtin.set_fact:
        _rustfs_ftps_san: >-
          {{ ((_rustfs_ftps_san_dns | map('regex_replace', '^', 'DNS:') | list)
              + (_rustfs_ftps_san_ip | map('regex_replace', '^', 'IP:') | list))
             | join(',') }}
      when: rustfs_ftps_self_signed | bool

    - name: ftps | check existing certificate material
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ rustfs_ftps_certs_dir }}/rustfs_cert.pem"
        - "{{ rustfs_ftps_certs_dir }}/rustfs_key.pem"
      register: _rustfs_ftps_existing

    - name: ftps | check existing certificate expiry
      ansible.builtin.command:
        argv:
          - openssl
          - x509
          - -in
          - "{{ rustfs_ftps_certs_dir }}/rustfs_cert.pem"
          - -noout
          - -checkend
          - "{{ rustfs_ftps_self_signed_renew_days | int * 86400 }}"
      register: _rustfs_ftps_existing_expiry
      changed_when: false
      failed_when: false
      when:
        - rustfs_ftps_self_signed | bool
        - _rustfs_ftps_existing.results[0].stat.exists

    - name: ftps | generate self-signed certificate
      ansible.builtin.command:
        argv:
          - openssl
          - req
          - -x509
          - -newkey
          - "rsa:{{ rustfs_ftps_self_signed_key_size }}"
          - -sha256
          - -nodes
          - -batch
          - -days
          - "{{ rustfs_ftps_self_signed_days }}"
          - -subj
          - "/CN={{ rustfs_ftps_self_signed_common_name }}/O=RustFS"
          - -addext
          - "basicConstraints=critical,CA:false"
          - -addext
          - "keyUsage=critical,digitalSignature,keyEncipherment"
          - -addext
          - "extendedKeyUsage=serverAuth"
          - -addext
          - "subjectKeyIdentifier=hash"
          - -addext
          - "authorityKeyIdentifier=keyid:always"
          - -addext
          - "subjectAltName={{ _rustfs_ftps_san }}"
          - -keyout
          - "{{ rustfs_ftps_certs_dir }}/rustfs_key.pem"
          - -out
          - "{{ rustfs_ftps_certs_dir }}/rustfs_cert.pem"
      when:
        - rustfs_ftps_self_signed | bool
        - >-
          (not _rustfs_ftps_existing.results[0].stat.exists or
          not _rustfs_ftps_existing.results[1].stat.exists or
          (_rustfs_ftps_existing_expiry.rc | default(1)) != 0)
      notify: restart rustfs service

    - name: ftps | check certificate material after generation
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ rustfs_ftps_certs_dir }}/rustfs_cert.pem"
        - "{{ rustfs_ftps_certs_dir }}/rustfs_key.pem"
      register: _rustfs_ftps_ready

    - name: ftps | require certificate and private key
      ansible.builtin.assert:
        that:
          - _rustfs_ftps_ready.results[0].stat.exists
          - _rustfs_ftps_ready.results[1].stat.exists
        fail_msg: >-
          FTPS is enabled but {{ rustfs_ftps_certs_dir }} does not contain both
          rustfs_cert.pem and rustfs_key.pem. Provide CA-issued files there, or
          set rustfs_ftps_self_signed: true for a test-only self-signed pair.

    - name: ftps | set certificate directory permissions
      ansible.builtin.file:
        path: "{{ rustfs_ftps_certs_dir }}"
        state: directory
        owner: "{{ rustfs_user }}"
        group: "{{ rustfs_group }}"
        mode: "0700"

    - name: ftps | secure private key
      ansible.builtin.file:
        path: "{{ rustfs_ftps_certs_dir }}/rustfs_key.pem"
        state: file
        owner: "{{ rustfs_user }}"
        group: "{{ rustfs_group }}"
        mode: "0600"

    - name: ftps | set certificate permissions
      ansible.builtin.file:
        path: "{{ rustfs_ftps_certs_dir }}/rustfs_cert.pem"
        state: file
        owner: "{{ rustfs_user }}"
        group: "{{ rustfs_group }}"
        mode: "0644"

    - name: ftps | validate certificate
      ansible.builtin.command:
        argv:
          - openssl
          - x509
          - -in
          - "{{ rustfs_ftps_certs_dir }}/rustfs_cert.pem"
          - -noout
          - -checkend
          - "0"
      changed_when: false

    - name: ftps | validate private key
      ansible.builtin.command:
        argv:
          - openssl
          - pkey
          - -in
          - "{{ rustfs_ftps_certs_dir }}/rustfs_key.pem"
          - -noout
          - -passin
          - "pass:"
      changed_when: false

    - name: ftps | read certificate public key
      ansible.builtin.command:
        argv:
          - openssl
          - x509
          - -in
          - "{{ rustfs_ftps_certs_dir }}/rustfs_cert.pem"
          - -noout
          - -pubkey
      register: _rustfs_ftps_cert_public
      changed_when: false

    - name: ftps | read private key public key
      ansible.builtin.command:
        argv:
          - openssl
          - pkey
          - -in
          - "{{ rustfs_ftps_certs_dir }}/rustfs_key.pem"
          - -pubout
          - -passin
          - "pass:"
      register: _rustfs_ftps_key_public
      changed_when: false

    - name: ftps | verify certificate and private key match
      ansible.builtin.assert:
        that:
          - _rustfs_ftps_cert_public.stdout == _rustfs_ftps_key_public.stdout
        fail_msg: >-
          The FTPS certificate and private key in {{ rustfs_ftps_certs_dir }} do
          not match.

---
# OS kernel tuning for RustFS

- name: kernel-tuning | apply sysctl performance settings
  become: true
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: "{{ rustfs_sysctl_file }}"
    sysctl_set: true
    state: present
    reload: true
  loop: "{{ rustfs_sysctl_settings | dict2items }}"

# NOTE: io_uring is no longer enabled through kernel.io_uring_disabled here.
# Since RustFS 1.0.x it is an opt-in read backend controlled per-process by
# RUSTFS_IO_URING_READ_ENABLE (see templates/rustfs.env.j2 and defaults).

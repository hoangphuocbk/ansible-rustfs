---
# Install the RustFS binary and prepare the filesystem layout

# --- required standard tools ----------------------------------------------
# The software checklist requires bash, glibc and openssl to be present. On
# Debian/Ubuntu glibc is provided by the `libc6` package (see defaults).
- name: install | ensure standard system tools are present
  become: true
  ansible.builtin.package:
    name: "{{ rustfs_system_packages }}"
    state: present
  when: rustfs_install_packages

# --- service user / group (skipped when running as root) ------------------
- name: install | add rustfs group
  become: true
  group:
    name: "{{ rustfs_group }}"
    state: present
  when: rustfs_user != 'root'

- name: install | add rustfs user
  become: true
  user:
    name: "{{ rustfs_user }}"
    group: "{{ rustfs_group }}"
    state: present
    shell: /bin/false
    system: true
    create_home: false
    home: /
  when: rustfs_user != 'root'

# --- binary staging -------------------------------------------------------
# Online: download the zip on the control node and extract the binary there.
# Air-gapped: skip the tasks below (enable_download_binary=false) and make sure
# {{ rustfs_download_local_dir }}/rustfs is pre-staged on the control node.
- name: install | download rustfs checksum list to control node
  become: false
  get_url:
    url: "{{ rustfs_checksums_url }}"
    dest: "{{ rustfs_download_local_dir }}/rustfs-SHA256SUMS-{{ rustfs_version }}"
    mode: "0644"
    validate_certs: "{{ rustfs_download_validate_certs }}"
  register: _download_checksums
  until: _download_checksums is succeeded
  retries: 5
  delay: 2
  delegate_to: localhost
  run_once: true
  when:
    - enable_download_binary
    - rustfs_verify_checksum
    - not ansible_check_mode

- name: install | resolve the expected archive checksum
  ansible.builtin.set_fact:
    _rustfs_archive_sha256: >-
      {{ lookup('ansible.builtin.file',
                rustfs_download_local_dir ~ '/rustfs-SHA256SUMS-' ~ rustfs_version)
         .splitlines()
         | select('match', '.*\s' ~ (rustfs_download_url | basename | regex_escape) ~ '$')
         | map('split')
         | map('first')
         | join('') }}
  when:
    - enable_download_binary
    - rustfs_verify_checksum
    - not ansible_check_mode

- name: install | require a checksum for the archive
  ansible.builtin.assert:
    that:
      - _rustfs_archive_sha256 | length == 64
    fail_msg: >-
      Could not find a SHA256 entry for {{ rustfs_download_url | basename }} in
      {{ rustfs_checksums_url }}. Set rustfs_verify_checksum=false only for a
      trusted mirror that does not publish checksums.
  when:
    - enable_download_binary
    - rustfs_verify_checksum
    - not ansible_check_mode

- name: install | download rustfs archive to control node
  become: false
  get_url:
    url: "{{ rustfs_download_url }}"
    dest: "{{ rustfs_download_local_dir }}/rustfs-{{ rustfs_version }}.zip"
    mode: "0644"
    checksum: "{{ ('sha256:' ~ _rustfs_archive_sha256) if (rustfs_verify_checksum and not ansible_check_mode) else omit }}"
    validate_certs: "{{ rustfs_download_validate_certs }}"
  register: _download_binary
  until: _download_binary is succeeded
  retries: 5
  delay: 2
  delegate_to: localhost
  run_once: true
  when: enable_download_binary

- name: install | extract rustfs binary on control node
  become: false
  unarchive:
    src: "{{ rustfs_download_local_dir }}/rustfs-{{ rustfs_version }}.zip"
    dest: "{{ rustfs_download_local_dir }}"
    remote_src: true
  delegate_to: localhost
  run_once: true
  when: enable_download_binary

- name: install | copy rustfs binary to target host
  become: true
  copy:
    src: "{{ rustfs_download_local_dir }}/rustfs"
    dest: "{{ rustfs_bin_path }}"
    owner: root
    group: root
    mode: 0755
  notify: restart rustfs service

# --- directory layout -----------------------------------------------------
- name: install | create rustfs working directory
  become: true
  file:
    path: "{{ rustfs_working_directory }}"
    state: directory
    owner: "{{ rustfs_user }}"
    group: "{{ rustfs_group }}"
    mode: 0755

- name: install | create rustfs log directory
  become: true
  file:
    path: "{{ rustfs_log_dir }}"
    state: directory
    owner: "{{ rustfs_user }}"
    group: "{{ rustfs_group }}"
    mode: 0750

- name: install | create rustfs data directories
  become: true
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ rustfs_user }}"
    group: "{{ rustfs_group }}"
    mode: 0750
  loop: "{{ rustfs_datadirs }}"
  when: rustfs_make_datadirs

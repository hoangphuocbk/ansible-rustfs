---
# defaults file for rustfs
#
# RustFS - high performance, S3 compatible, distributed object storage.
# Reference:
#   https://docs.rustfs.com/en/installation/linux/prerequisites-and-service
#   https://docs.rustfs.com/en/installation/requirement/disk-preparation
#   https://docs.rustfs.com/en/installation/requirement/checklists/software-checklists

# ----------------------------------------------------------------------------
# Installation / binary staging
# ----------------------------------------------------------------------------
# RustFS is shipped as a single static binary inside a zip archive.
# 1.0.x also publishes .deb and .rpm packages (gnu and musl, amd64/arm64) and
# bundles the CLI in the Linux artifacts - this role still uses the zip.
# This role fetches the glibc (gnu) build; override with "-musl-" for musl.
# Since 1.0.2 the gnu artifacts pin a glibc 2.31 ABI floor.
rustfs_version: "1.0.3"
rustfs_download_url: "https://github.com/rustfs/rustfs/releases/download/{{ rustfs_version }}/rustfs-linux-x86_64-gnu-v{{ rustfs_version }}.zip"

# Local (control node) staging directory.
#   - online deploy : the archive is downloaded here and unpacked.
#   - air-gapped    : pre-stage the already-extracted `rustfs` binary here
#                     (so {{ rustfs_download_local_dir }}/rustfs exists) and
#                     set `enable_download_binary: false`.
rustfs_download_local_dir: /tmp

# When true the binary is fetched from the internet on the control node.
# Set to false for air-gapped environments (binary must be pre-staged).
enable_download_binary: true

# Where the binary is installed on the target hosts.
rustfs_bin_path: /usr/local/bin/rustfs

# Standard tools required by the software checklist.
#   `libc6` is the Debian/Ubuntu package that provides glibc; on RHEL-family
#   distributions override this with `glibc`. See:
#   https://docs.rustfs.com/en/installation/requirement/checklists/software-checklists
rustfs_install_packages: true
rustfs_system_packages:
  - libc6
  - openssl

# ----------------------------------------------------------------------------
# Service identity
# ----------------------------------------------------------------------------
# RustFS official docs run the service as root. Set to a dedicated, unprivileged
# user (e.g. "rustfs") to harden the deployment - the role will create it and
# chown the data / log directories accordingly.
rustfs_user: rustfs
rustfs_group: "{{ rustfs_user }}"

rustfs_service_name: rustfs

# systemd WorkingDirectory. The role creates it and assigns it to the service
# identity.
rustfs_working_directory: /opt/rustfs

# ----------------------------------------------------------------------------
# Listening addresses
# ----------------------------------------------------------------------------
# S3 API listen address (host:port, host may be empty to bind all interfaces).
rustfs_address: ":9000"
rustfs_api_port: 9000

# Built-in web console.
rustfs_console_enable: true
rustfs_console_address: ":9001"
rustfs_console_port: 9001

# Embedded console URL path prefix (RUSTFS_CONSOLE_PREFIX), e.g. when the
# console is served behind a reverse proxy on a subpath
# (https://host/rustfs/console). Read once at startup. Leave empty to keep the
# built-in default "/rustfs/console".
rustfs_console_prefix: ""

# CORS allow-lists (comma-separated origins, or "*").
# RustFS 1.0.x defaults both to empty = same-origin only, so browsers cannot
# read S3/console responses cross-origin unless an origin is listed here.
# Only rendered when non-empty so the secure default is preserved.
rustfs_cors_allowed_origins: ""           # RUSTFS_CORS_ALLOWED_ORIGINS (S3 API)
rustfs_console_cors_allowed_origins: ""   # RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS

# ----------------------------------------------------------------------------
# FTP / FTPS gateway (both disabled by default)
# ----------------------------------------------------------------------------
# RustFS includes plain FTP and explicit FTPS (FTPES) listeners in the
# standard binary. Plain FTP sends credentials and data in clear text, so the
# role binds it to loopback by default. Enable it only for isolated testing;
# use FTPS for every remote or production connection.
rustfs_ftp_enable: false
# Upstream default is 0.0.0.0:8021; the role binds to loopback for safety.
rustfs_ftp_address: "127.0.0.1:8021"
# Inclusive passive-mode data port range ("start-end").
rustfs_ftp_passive_ports: "40000-50000"
# Public IP or hostname advertised to passive clients behind NAT.
# Empty leaves RUSTFS_FTP_EXTERNAL_IP unset.
rustfs_ftp_external_ip: ""

# Explicit FTPS (FTPES). RustFS requires TLS on both the control and data
# channels; implicit FTPS is not supported. TLS is always enabled here.
rustfs_ftps_enable: false
rustfs_ftps_address: "0.0.0.0:8022"
rustfs_ftps_passive_ports: "40000-50000"
# Public IP or hostname advertised to passive clients behind NAT.
# Empty leaves RUSTFS_FTPS_EXTERNAL_IP unset.
rustfs_ftps_external_ip: ""

# Directory containing rustfs_cert.pem and rustfs_key.pem. The role creates it
# with mode 0700, sets the key to 0600 and the certificate to 0644, and
# validates that the pair parses, is not expired and matches.
rustfs_ftps_certs_dir: /etc/rustfs/ftps-certs

# Testing-only feature flag: generate a self-signed certificate when FTPS is
# enabled and the files are absent (or expire within the renewal window).
# Use a certificate from a trusted CA in production. The key has no
# passphrase because the systemd service must read it unattended; access is
# restricted by the directory and file modes above.
rustfs_ftps_self_signed: false
# Subject CN and SANs. The generated SAN list always includes the CN,
# inventory/host/FQDN names, localhost, 127.0.0.1 and the default IPv4
# address; add every other DNS name or IP address clients use.
rustfs_ftps_self_signed_common_name: "{{ inventory_hostname }}"
rustfs_ftps_self_signed_dns_sans: []
rustfs_ftps_self_signed_ip_sans: []
# RSA key size and validity period. The role rejects key sizes below 2048.
rustfs_ftps_self_signed_key_size: 4096
rustfs_ftps_self_signed_days: 365
# Regenerate the self-signed certificate when it expires within this many days.
rustfs_ftps_self_signed_renew_days: 30

# ----------------------------------------------------------------------------
# Credentials (CHANGE THESE - keep them identical across every node)
# ----------------------------------------------------------------------------
# RustFS 1.0.x fails closed on multi-node clusters that still use the public
# default "rustfsadmin": it refuses to derive the internode RPC secret from a
# default credential pair. Change BOTH keys (or set rustfs_rpc_secret below).
# Since 1.0.2 secret keys may exceed 40 bytes (minimum 8 bytes); the full value
# is used for signing. Keep the pair identical on every node.
rustfs_access_key: rustfsadmin
rustfs_secret_key: rustfsadmin

# Internode RPC authentication secret (RUSTFS_RPC_SECRET).
# Required when the active access/secret key pair is left at the default.
# When empty, RustFS derives it from a NON-default access/secret key pair, so
# setting strong `rustfs_access_key` / `rustfs_secret_key` is usually enough.
# If set, it MUST be identical on every node. Generate with:
#   openssl rand -base64 32
rustfs_rpc_secret: ""

# ----------------------------------------------------------------------------
# Volumes / topology
# ----------------------------------------------------------------------------
# RustFS uses {x...y} expansion notation. For a multi-node multi-disk cluster
# the value MUST be identical on every node and resolve to all peers, e.g.
# 4 nodes x 4 disks:
#   - "http://node{1...4}:9000/data/rustfs{0...3}"
# This list is space-joined into RUSTFS_VOLUMES.
rustfs_volumes:
  - "http://node{1...4}:{{ rustfs_api_port }}/data/rustfs{0...3}"

# Data directories to create on each node (must match the volume notation
# above). These are expected to be separate XFS-formatted disks mounted in
# JBOD mode - the role only creates the directories, it does not format disks.
# See the "Disk preparation" section of the README for a formatting guide.
rustfs_make_datadirs: true
rustfs_datadirs:
  - /data/rustfs0
  - /data/rustfs1
  - /data/rustfs2
  - /data/rustfs3

# ----------------------------------------------------------------------------
# Logging
# ----------------------------------------------------------------------------
# rustfs-obs writes rotated log files here. When the path is under /var/log,
# the unit also sets LogsDirectory so systemd creates it for the service user;
# stdout/stderr always go to the journal.
rustfs_log_dir: /var/log/rustfs
rustfs_log_level: error          # maps to RUSTFS_OBS_LOGGER_LEVEL / RUST_LOG

# --- Log cleanup / rolling files -------------------------------------------
# Handled by the rustfs-obs log cleaner. See:
#   https://github.com/rustfs/rustfs/blob/main/crates/obs/README.md
# Total size cap for the log directory (bytes). Default 2 GiB.
rustfs_log_max_total_size_bytes: 2147483648
# Per-file size cap in bytes; 0 = unlimited.
rustfs_log_max_single_file_size_bytes: 0
# Number of rolling files to keep.
rustfs_log_keep_files: 30
# Rotation granularity: minutely | hourly | daily.
rustfs_log_rotation_time: hourly
# Compress rotated files before deleting them.
rustfs_log_compress_old_files: true
# Compression codec: zstd | gzip.
rustfs_log_compression_algorithm: zstd
# Delete compressed archives older than N days; 0 = keep forever.
rustfs_log_compressed_file_retention_days: 30
# How often the cleanup task runs (seconds).
rustfs_log_cleanup_interval_seconds: 1800
# Parallel (work-stealing) compression and worker count.
rustfs_log_parallel_compress: true
rustfs_log_parallel_workers: 6
# zstd level 1 (fastest) - 21 (best ratio).
rustfs_log_zstd_compression_level: 8
# Report deletions without removing files (useful for auditing).
rustfs_log_dry_run: false

# Free-form text appended verbatim to the environment file for any extra
# RUSTFS_* variables not modelled above.
rustfs_env_extra: ""
rustfs_envfile: /etc/default/rustfs

# ----------------------------------------------------------------------------
# systemd resource limits
# ----------------------------------------------------------------------------
rustfs_limit_nofile: 1048576
rustfs_limit_nproc: 32768
rustfs_restart_sec: 10s

# ----------------------------------------------------------------------------
# OS kernel tuning
# ----------------------------------------------------------------------------
rustfs_tune_kernel: true
# Persisted to {{ rustfs_sysctl_file }} via ansible.posix.sysctl.
rustfs_sysctl_file: /etc/sysctl.d/90-rustfs.conf
rustfs_sysctl_settings:
  net.core.rmem_max: 16777216
  net.core.wmem_max: 16777216
  net.ipv4.tcp_keepalive_time: 600
  net.ipv4.tcp_slow_start_after_idle: 0
  vm.swappiness: 10
  net.core.somaxconn: 32768

# ----------------------------------------------------------------------------
# io_uring (opt-in read backend)
# ----------------------------------------------------------------------------
# As of RustFS 1.0.x io_uring is an opt-in read path, disabled by default and
# enabled per-process with RUSTFS_IO_URING_READ_ENABLE=true. It requires
# Linux 5.10+ to be effective. No kernel-wide sysctl is required. See:
#   https://docs.rustfs.com/en/installation/requirement/checklists/software-checklists
#   https://github.com/rustfs/rustfs/blob/main/docs/operations/io-uring-initialization.md
rustfs_enable_io_uring: true

# Optional io_uring tuning. Leave null to use the RustFS defaults; each value
# is only written to the environment file when set.
#   RUSTFS_IO_URING_SHARDS                 per-disk shard count
#   RUSTFS_IO_URING_MAX_DRIVER_THREADS     process-wide driver-thread budget (0 = unlimited)
#   RUSTFS_IO_URING_READ_BUDGET_TOTAL_BYTES / ..._DRIVER_BYTES   shared read budget
#   RUSTFS_IO_URING_READ_RESULT_BUDGET_BYTES                     returned-result budget
rustfs_io_uring_shards: null
rustfs_io_uring_max_driver_threads: null
rustfs_io_uring_read_budget_total_bytes: null
rustfs_io_uring_read_budget_driver_bytes: null
rustfs_io_uring_read_result_budget_bytes: null
# Maximum logical size of one io_uring read operation, in bytes
# (4 KiB .. 128 MiB). RustFS 1.0.1 added this knob; unset keeps the 128 MiB cap.
rustfs_io_uring_read_chunk_bytes: null

# ----------------------------------------------------------------------------
# Firewall (optional)
# ----------------------------------------------------------------------------
# Off by default - Ubuntu typically uses ufw/nftables. When enabled the role
# opens the API and console ports to the other members of `rustfs_cluster`.
rustfs_configure_iptables: false
rustfs_cluster: rustfs-cluster
# Interface that carries cluster traffic, and its IPv4 address. The role
# derives rustfs_bind_address from gathered interface facts; set it explicitly
# to override the address (for example, to use a stable VIP).
rustfs_bind_interface: eth0
rustfs_bind_address: ""

---

# Multi-node multi-disk RustFS deployment (3 nodes x 4 disks).
#
# RustFS requires every node to (re)start at the same time, so the play runs
# against all hosts at once (no `serial`) - handlers fire across the whole
# cluster in the same run. Re-run with `--limit` only for additive scaling.

- hosts: rustfs-cluster
  gather_facts: true
  remote_user: vagrant
  pre_tasks:
    - name: Check that the RustFS bind interface exists
      ansible.builtin.assert:
        that:
          - ('ansible_' ~ rustfs_bind_interface) in hostvars[inventory_hostname]
        fail_msg: >-
          rustfs_bind_interface '{{ rustfs_bind_interface }}' is not present on
          {{ inventory_hostname }}. Available interfaces:
          {{ ansible_interfaces | default([]) | join(', ') }}.
  tasks:
    - name: Include rustfs role
      include_role:
        name: ../../ansible-rustfs/
  vars:
    # ---- binary -----------------------------------------------------------
    rustfs_version: 1.0.3
    rustfs_download_url: "https://github.com/rustfs/rustfs/releases/download/{{ rustfs_version }}/rustfs-linux-x86_64-gnu-v{{ rustfs_version }}.zip"
    rustfs_download_local_dir: /tmp
    # Online deploy. For air-gapped: set this to false and pre-stage the
    # extracted binary at /tmp/rustfs on the control node.
    enable_download_binary: true
    rustfs_bin_path: /usr/local/bin/rustfs

    # ---- identity ---------------------------------------------------------
    rustfs_user: rustfs-user
    rustfs_group: rustfs-user

    # ---- listeners --------------------------------------------------------
    # Vagrant host-only NIC used for S3/console and cluster traffic.
    rustfs_bind_interface: eth1
    rustfs_bind_address: "{{ hostvars[inventory_hostname]['ansible_' + rustfs_bind_interface]['ipv4']['address'] }}"
    rustfs_address: "{{ rustfs_bind_address }}:{{ rustfs_api_port }}"
    rustfs_api_port: 9000
    rustfs_console_enable: true
    rustfs_console_address: "{{ rustfs_bind_address }}:{{ rustfs_console_port }}"
    rustfs_console_port: 9001

    # ---- credentials (CHANGE ME) -----------------------------------------
    rustfs_access_key: "rustfsadmin"
    rustfs_secret_key: "ChangeMe-Str0ng-Secret"
    rustfs_rpc_secret: "ChangeMe-Shared-Rpc-Secret"

    # ---- topology: 3 nodes x 4 disks -------------------------------------
    rustfs_volumes:
      - "http://node{1...3}:9000/data/rustfs{0...3}"
    rustfs_make_datadirs: true
    rustfs_datadirs:
      - /data/rustfs0
      - /data/rustfs1
      - /data/rustfs2
      - /data/rustfs3

    # ---- logging ----------------------------------------------------------
    rustfs_log_dir: /var/log/rustfs
    rustfs_log_level: error

    # ---- log cleanup / rolling files -------------------------------------
    rustfs_log_keep_files: 30
    rustfs_log_max_total_size_bytes: 2147483648
    rustfs_log_compression_algorithm: zstd
    rustfs_log_compressed_file_retention_days: 30

    # ---- kernel tuning + io_uring ----------------------------------------
    rustfs_tune_kernel: true
    # Opt-in io_uring read backend (no kernel sysctl required in 1.0.x).
    rustfs_enable_io_uring: true
    # rustfs_io_uring_read_chunk_bytes: 8388608   # optional per-op read cap

    # ---- console (1.0.x) -------------------------------------------------
    # Serve the console on a reverse-proxy subpath, e.g. /rustfs/console:
    # rustfs_console_prefix: "/rustfs/console"
    # Cross-origin browser access is denied by default; allow-list as needed:
    # rustfs_cors_allowed_origins: "https://app.example.com"
    # rustfs_console_cors_allowed_origins: "https://app.example.com"

    # ---- FTP(S) ----------------------------------------------------------
    # Plain FTP is intentionally disabled: it sends credentials and data in
    # clear text. Enable it only on loopback or an isolated test network.
    rustfs_ftp_enable: false
    rustfs_ftp_address: "{{ rustfs_bind_address }}:8021"
    # Explicit FTPS (FTPES) with a test-only self-signed certificate.
    rustfs_ftps_enable: false
    rustfs_ftps_address: "{{ rustfs_bind_address }}:8022"
    rustfs_ftps_passive_ports: "40000-40010"
    rustfs_ftps_self_signed: false
    rustfs_ftps_self_signed_ip_sans:
      - "{{ rustfs_bind_address }}"

    # ---- firewall (Ubuntu uses ufw by default; off here) -----------------
    rustfs_configure_iptables: false
    rustfs_cluster: rustfs-cluster

    # extra RUSTFS_* variables
    rustfs_env_extra:
      - RUSTFS_UNSAFE_BYPASS_DISK_CHECK=true
      # - RUSTFS_COMPRESSION_ENABLED=true
